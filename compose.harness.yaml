services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: harness
      POSTGRES_PASSWORD: ${HARNESS_DB_PASSWORD:?launcher must supply password}
      POSTGRES_DB: harness
    ports:
      - "127.0.0.1::5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harness -d harness"]
      interval: 1s
      timeout: 3s
      retries: 60
